[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "barebase"
version = "0.1.0"
description = "Everything your backend needs. Nothing it does not. Installer and project scaffolder for BareBase - the zero-dependency, drop-in Directus and Strapi replacement."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "BareBase" }]
keywords = ["headless-cms", "cms", "directus", "strapi", "backend", "clickhouse", "mcp", "self-hosted", "api"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Environment :: Console",
]

[project.urls]
Homepage = "https://barebase.io"
Repository = "https://github.com/barebasecms/barebase-cli"
Issues = "https://github.com/barebasecms/barebase-cli/issues"

[project.scripts]
barebase = "barebase.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["barebase"]
